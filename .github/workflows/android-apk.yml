name: Compilar VORKAN CLIMB 2.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Firebase desde secreto (si existe)
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG_BASE64" ]; then
            printf %s "$FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json
            chmod 600 app/google-services.json
          fi
      - name: Preparar firma permanente VORKAN 2.0
        env:
          VORKAN_SIGNING_PASSWORD: ${{ secrets.VORKAN_SIGNING_PASSWORD }}
        run: |
          if [ -z "$VORKAN_SIGNING_PASSWORD" ]; then
            echo "::error::Falta el secreto VORKAN_SIGNING_PASSWORD. No se genera una APK con firma temporal."
            exit 1
          fi
          base64 --decode signing/vorkan-climb-2-release.jks.enc.b64 > "$RUNNER_TEMP/vorkan.jks.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \\
            -in "$RUNNER_TEMP/vorkan.jks.enc" \\
            -out "$RUNNER_TEMP/vorkan-climb-2-release.jks" \\
            -pass env:VORKAN_SIGNING_PASSWORD
          chmod 600 "$RUNNER_TEMP/vorkan-climb-2-release.jks"
          echo "ESCALADA_KEYSTORE_PATH=$RUNNER_TEMP/vorkan-climb-2-release.jks" >> "$GITHUB_ENV"
          echo "ESCALADA_KEY_ALIAS=vorkan2" >> "$GITHUB_ENV"
          echo "ESCALADA_KEYSTORE_PASSWORD=$VORKAN_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "ESCALADA_KEY_PASSWORD=$VORKAN_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/vorkan-climb-2-release.jks" \\
            -storepass "$VORKAN_SIGNING_PASSWORD" -alias vorkan2 | grep 'SHA1:'
      - name: Pruebas
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: APK firmada de VORKAN 2.0
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: VORKAN-CLIMB-2-APK-firmada
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1
