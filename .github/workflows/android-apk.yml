name: Compilar VORKAN CLIMB 2.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Firebase desde secreto (si existe)
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG_BASE64" ]; then
            printf %s "$FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json
            chmod 600 app/google-services.json
          fi
      - name: Pruebas
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: APK independiente de prueba
        run: gradle --no-daemon --stacktrace --info :app:clean :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VORKAN-CLIMB-2-APK-prueba
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
